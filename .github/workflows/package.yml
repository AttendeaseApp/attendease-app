name: TEST AND LINT

on:
     push:
          branches: [master]
     pull_request:
          branches: [master]
     workflow_dispatch:

jobs:
     test-and-lint:
          name: Lint and Typecheck
          runs-on: ubuntu-latest

          steps:
               - name: Checkout code
                 uses: actions/checkout@v4

               - name: Setup Node.js
                 uses: actions/setup-node@v4
                 with:
                      node-version: "20"
                      cache: "npm"

               - name: Install dependencies
                 run: npm ci

               - name: Run ESLint
                 run: npm run lint

               - name: Run TypeScript compiler
                 run: npx tsc --noEmit

     build-status:
          name: Build status summary
          runs-on: ubuntu-latest
          needs: [test-and-lint]
          if: always()

          steps:
               - name: Check build status
                 run: |
                      RESULT="${{ needs.test-and-lint.result }}"
                      echo "Build result: $RESULT"

                      if [[ "$RESULT" == "success" ]]; then
                        echo "All checks successfully passed"
                      else
                        echo "Build failed"
                        exit 1
                      fi
