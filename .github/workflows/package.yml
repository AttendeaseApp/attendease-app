name: Build and TesT

on:
     push:
          branches: [master]
     pull_request:
          branches: [master]
     workflow_dispatch:

jobs:
     lint:
          name: Lint
          runs-on: ubuntu-latest

          steps:
               - name: Checkout code
                 uses: actions/checkout@v4

               - name: Setup Node.js
                 uses: actions/setup-node@v4
                 with:
                      node-version: "20"
                      cache: "npm"

               - name: Install dependencies
                 run: npm ci

               - name: Run ESLint
                 run: npm run lint
                 continue-on-error: false

     type-check:
          name: Typescript typecheck
          runs-on: ubuntu-latest

          steps:
               - name: Checkout code
                 uses: actions/checkout@v4

               - name: Setup Node.js
                 uses: actions/setup-node@v4
                 with:
                      node-version: "20"
                      cache: "npm"

               - name: Install dependencies
                 run: npm ci

               - name: Run TypeScript compiler
                 run: npx tsc --noEmit

     build-status:
          name: Build status summary
          runs-on: ubuntu-latest
          needs: [lint, type-check, build-android]
          if: always()

          steps:
               - name: Check build status
                 run: |
                      echo "Linting: ${{ needs.lint.result }}"
                      echo "Type checking: ${{ needs.type-check.result }}"

                      if [[ "${{ needs.lint.result }}" == "failure" ]] || \
                         [[ "${{ needs.type-check.result }}" == "failure" ]] then
                        echo "Build failed"
                        exit 1
                      else
                        echo "All builds sucessfully passed"
                      fi
